name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: pcurl
            asset_name: pcurl-linux-x64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: pcurl
            asset_name: pcurl-linux-arm64

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: pcurl
            asset_name: pcurl-macos-x64

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: pcurl
            asset_name: pcurl-macos-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: pcurl.exe
            asset_name: pcurl-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Install ARM64 cross-compiler (Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare artifacts
        run: |
          mkdir -p upload
          cp artifacts/pcurl-linux-x64/pcurl           upload/pcurl-linux-x64       || true
          cp artifacts/pcurl-linux-arm64/pcurl          upload/pcurl-linux-arm64     || true
          cp artifacts/pcurl-macos-x64/pcurl            upload/pcurl-macos-x64       || true
          cp artifacts/pcurl-macos-arm64/pcurl          upload/pcurl-macos-arm64     || true
          cp artifacts/pcurl-windows-x64.exe/pcurl.exe  upload/pcurl-windows-x64.exe || true
          ls -la upload/

      # The installer verifies these before running the binary, so a tampered
      # asset cannot be installed silently.
      - name: Generate checksums
        run: |
          cd upload
          sha256sum pcurl-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        run: |
          # A tag with a dash (v1.6.0-beta.1) is a pre-release, so `/releases/latest`
          # keeps pointing at the previous stable release and the installer never
          # picks up a beta.
          PRE=""
          case "${{ github.ref_name }}" in *-*) PRE="--prerelease" ;; esac
          gh release create ${{ github.ref_name }} \
            upload/pcurl-linux-x64 \
            upload/pcurl-linux-arm64 \
            upload/pcurl-macos-x64 \
            upload/pcurl-macos-arm64 \
            upload/pcurl-windows-x64.exe \
            upload/SHA256SUMS \
            --generate-notes $PRE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}